<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" fill="none" role="img" aria-labelledby="surveillance-title surveillance-desc">
  <title id="surveillance-title">Cold War-inspired signals monitor</title>
  <desc id="surveillance-desc">An original illustration of a green phosphor radar display, abstract signal contacts, and a radio waveform. This is a visual interpretation of surveillance technology, not an archival image or real monitoring data.</desc>
  <defs>
    <pattern id="surveillance-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#314b32" stroke-opacity=".2" stroke-width=".7"/>
    </pattern>
    <pattern id="surveillance-scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H4" stroke="#bdd89e" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="surveillance-screen-glow" cx=".5" cy=".46" r=".64">
      <stop stop-color="#172b1b"/>
      <stop offset=".64" stop-color="#0c1c12"/>
      <stop offset="1" stop-color="#07110c"/>
    </radialGradient>
    <linearGradient id="surveillance-sweep-glow" x1="115" y1="136" x2="264" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bdd89e" stop-opacity="0"/>
      <stop offset=".65" stop-color="#bdd89e" stop-opacity=".05"/>
      <stop offset="1" stop-color="#bdd89e" stop-opacity=".29"/>
    </linearGradient>
    <filter id="surveillance-phosphor-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
    <clipPath id="surveillance-screen-clip"><rect x="1" y="1" width="498" height="458" rx="6"/></clipPath>
    <clipPath id="surveillance-radar-clip"><circle cx="250" cy="210" r="168"/></clipPath>
  </defs>

  <g clip-path="url(#surveillance-screen-clip)">
    <path fill="url(#surveillance-screen-glow)" d="M0 0h500v460H0z"/>
    <path fill="url(#surveillance-grid)" d="M28 30h444v352H28z"/>

    <g fill="#91ac7d" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.3">
      <text x="24" y="25">SIGNAL FIELD</text>
      <text x="476" y="25" text-anchor="end">RX / 07</text>
    </g>

    <g stroke="#314b32" stroke-width="1">
      <circle cx="250" cy="210" r="168"/>
      <circle cx="250" cy="210" r="126"/>
      <circle cx="250" cy="210" r="84"/>
      <circle cx="250" cy="210" r="42"/>
      <path d="M82 210h336M250 42v336"/>
      <path d="M131.2 91.2l237.6 237.6M131.2 328.8L368.8 91.2" stroke-opacity=".5"/>
      <circle cx="250" cy="210" r="177" stroke-opacity=".42"/>
    </g>

    <g stroke="#718b61" stroke-width="1.2">
      <path d="M250 31v11M250 378v11M71 210h11M418 210h11"/>
      <path d="M160.5 55l4.5 8M335 357l4.5 8M95 120.5l8 4.5M397 295l8 4.5M95 299.5l8-4.5M397 125l8-4.5M160.5 365l4.5-8M335 63l4.5-8"/>
    </g>
    <g fill="#91ac7d" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1">
      <text x="250" y="16" text-anchor="middle">000</text>
      <text x="445" y="214">090</text>
      <text x="250" y="405" text-anchor="middle">180</text>
      <text x="29" y="214">270</text>
    </g>

    <g clip-path="url(#surveillance-radar-clip)">
      <g class="radar-sweep">
        <path d="M250 210L112 114A168 168 0 0 1 250 42Z" fill="url(#surveillance-sweep-glow)"/>
        <path d="M250 210V42" stroke="#bdd89e" stroke-opacity=".45" stroke-width="5" filter="url(#surveillance-phosphor-glow)"/>
        <path d="M250 210V42" stroke="#d6ecc0" stroke-width="1.25"/>
      </g>

      <g class="radar-contact" style="--contact-delay:0s">
        <circle cx="250" cy="82" r="7" fill="#bdd89e" fill-opacity=".18" filter="url(#surveillance-phosphor-glow)"/>
        <path d="M245 82h10M250 77v10" stroke="#d1e7b7" stroke-width="1.6"/>
        <path d="M261 82h15l11-10h31" stroke="#8da47b" stroke-opacity=".8"/>
        <text x="292" y="65" fill="#bdd89e" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing=".8">A</text>
      </g>
      <g class="radar-contact" style="--contact-delay:2s">
        <circle cx="361" cy="274" r="7" fill="#bdd89e" fill-opacity=".18" filter="url(#surveillance-phosphor-glow)"/>
        <path d="M356 274h10M361 269v10" stroke="#d1e7b7" stroke-width="1.6"/>
        <path d="M350 274h-15l-12 11h-28" stroke="#8da47b" stroke-opacity=".8"/>
        <text x="295" y="300" fill="#bdd89e" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing=".8">B</text>
      </g>
      <g class="radar-contact" style="--contact-delay:4s">
        <circle cx="139" cy="274" r="7" fill="#bdd89e" fill-opacity=".18" filter="url(#surveillance-phosphor-glow)"/>
        <path d="M134 274h10M139 269v10" stroke="#d1e7b7" stroke-width="1.6"/>
        <path d="M150 274h16l12-11h23" stroke="#8da47b" stroke-opacity=".8"/>
        <text x="185" y="254" fill="#bdd89e" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing=".8">C</text>
      </g>

      <g stroke="#687e58" stroke-opacity=".55" stroke-width=".85" stroke-dasharray="2 6">
        <path d="M250 82l111 192H139Z"/>
      </g>
    </g>

    <circle cx="250" cy="210" r="3" fill="#d5e6bf"/>
    <circle cx="250" cy="210" r="10" stroke="#8da47b" stroke-width=".8"/>

    <g stroke="#314b32" stroke-width="1">
      <path d="M24 390h134M342 390h134M24 448h452"/>
      <path d="M24 397v43M476 397v43"/>
      <path d="M38 419h424" stroke-dasharray="2 4"/>
    </g>
    <text x="26" y="381" fill="#8ca279" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1">AUDIO / SIGNAL</text>
    <text x="475" y="381" fill="#d2ae65" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1">ANALOG</text>
    <g class="signal-wave" stroke-linejoin="round" stroke-linecap="round">
      <path d="M39 419h15l4-3 4 6 4-9 5 14 5-20 6 24 6-27 6 30 5-25 5 18 5-11 5 5h20l5-7 5 13 5-20 6 28 6-35 6 37 6-31 5 23 5-14 5 7h18l4-4 4 8 5-14 6 23 5-30 6 32 6-26 5 18 5-10 5 3h22l5-9 5 17 6-26 5 33 6-39 6 41 5-32 6 23 5-13 5 5h23l5-4 4 8 5-14 5 22 6-29 5 31 6-26 5 18 5-10 5 3h17" stroke="#bdd89e" stroke-opacity=".35" stroke-width="4" filter="url(#surveillance-phosphor-glow)"/>
      <path d="M39 419h15l4-3 4 6 4-9 5 14 5-20 6 24 6-27 6 30 5-25 5 18 5-11 5 5h20l5-7 5 13 5-20 6 28 6-35 6 37 6-31 5 23 5-14 5 7h18l4-4 4 8 5-14 6 23 5-30 6 32 6-26 5 18 5-10 5 3h22l5-9 5 17 6-26 5 33 6-39 6 41 5-32 6 23 5-13 5 5h23l5-4 4 8 5-14 5 22 6-29 5 31 6-26 5 18 5-10 5 3h17" stroke="#bdd89e" stroke-width="1.1"/>
    </g>
    <path fill="url(#surveillance-scanlines)" d="M0 0h500v460H0z"/>
    <rect x="1" y="1" width="498" height="458" rx="6" stroke="#718b61" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
